<!doctype html>
<html lang="ru">
  <head>
    <script>
      (function () {
        if (location.protocol !== "http:" && location.protocol !== "https:") return;
        var path = location.pathname;
        if (/\.html?$/i.test(path)) path = path.replace(/[^/]+$/, "");
        if (!path.endsWith("/")) path += "/";
        var b = document.createElement("base");
        b.href = location.origin + path.replace(/\/{2,}/g, "/");
        document.head.insertBefore(b, document.head.firstChild);
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Циан — Заряженный помощник (мини‑игра)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="device" aria-label="Прототип экрана игры">
        <div class="screen" id="screen">
          <section class="intro-screen" id="introScreen" aria-label="Открытие игры">
            <div class="intro-strip" id="introStrip">
              <div class="intro-screen__map" aria-hidden="true">
                <iframe
                  title="Яндекс.Карты"
                  loading="eager"
                  referrerpolicy="no-referrer-when-downgrade"
                  allow="fullscreen"
                  src="https://yandex.ru/map-widget/v1/?ll=30.3141%2C59.9386&z=11&l=map"
                ></iframe>
              </div>
            </div>
            <div class="intro-catcher" id="introCatcher">
              <svg class="intro-curtain__svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <path id="introOuterPath" class="catcher__outer" d="" />
                <path id="introMidPath" class="catcher__mid" d="" />
                <path id="introInnerPath" class="intro-curtain__inner" d="" />
              </svg>
              <button class="intro-handle" id="introHandle" type="button" aria-label="Потяните, чтобы открыть игру">
                <img class="intro-handle__ball" src="./asset/game-items/logo-ball-intro.svg" alt="" draggable="false" />
              </button>
            </div>
          </section>

          <section class="start-screen is-hidden" id="startScreen" role="dialog" aria-modal="true" aria-label="Старт игры">
            <div class="start-screen__card">
              <div class="start-screen__slides">
                <div class="start-screen__slide start-screen__slide--intro is-active" id="startSlideIntro" aria-label="Вводный экран">
                  <div class="start-screen__hero-wrap">
                    <img class="start-screen__hero" src="./asset/game-items/key1.png" alt="" />
                  </div>

                  <h1 class="start-screen__title">Ловите ключи, чтобы побыстрее въехать</h1>
                  <p class="start-screen__subtitle">Соберите 20 ключей и выберите подарок</p>

                  <div class="start-screen__prizes prizes-list" role="list" aria-label="Подарки" id="startPrizesList"></div>

                  <button class="start-screen__cta" id="rulesBtn" type="button">Объясните правила</button>
                </div>

                <div class="start-screen__slide start-screen__slide--rules" id="startSlideRules" aria-label="Правила игры">
                  <h1 class="start-screen__title start-screen__title--rules">Правила игры</h1>

                  <div class="rules-arrows" aria-hidden="true">
                    <div class="rules-arrow rules-arrow--left">
                      <img class="rules-arrow__icon" src="./asset/game-items/ArrowRight.svg" alt="" aria-hidden="true" />
                    </div>
                    <div class="rules-arrow rules-arrow--right">
                      <img class="rules-arrow__icon" src="./asset/game-items/ArrowRight.svg" alt="" aria-hidden="true" />
                    </div>
                  </div>

                  <p class="start-screen__rulesText">Управляйте ловцом с помощью стрелок</p>

                  <div class="start-screen__obstacles" aria-label="Кого избегать">
                    <div class="obstacles__row">
                      <img class="obstacles__img" src="./asset/game-items/thief.png" alt="" />
                      <img class="obstacles__img" src="./asset/game-items/granny.png" alt="" />
                      <img class="obstacles__img" src="./asset/game-items/invis.png" alt="" />
                    </div>
                    <p class="start-screen__obstaclesText">Берегитесь мошенников, злых соседок и подозрительных застройщиков</p>
                  </div>

                  <button class="start-screen__cta" id="startBtn" type="button">Поехали!</button>
                </div>
              </div>
            </div>
          </section>

          <header class="hud">
            <div class="hud__score" aria-label="Ключи">
              <span id="scoreNow">0</span><span class="hud__score-sep">/</span><span id="scoreTotal">20</span>
            </div>
            <div class="hud__lives-wrap">
              <div class="hud__lives" aria-label="Жизни">
                <span class="life life--heart is-on" aria-hidden="true">♥</span>
                <span class="life life--heart is-on" aria-hidden="true">♥</span>
                <span class="life life--heart is-on" aria-hidden="true">♥</span>
                <span class="life life--heart is-on" aria-hidden="true">♥</span>
                <span class="life life--heart is-on" aria-hidden="true">♥</span>
              </div>
            </div>
            <button class="hud__close" type="button" aria-label="Закрыть">
              <img class="hud__close-icon" src="./asset/game-items/Close.svg" alt="" />
            </button>
          </header>

          <div class="arena" id="arena" aria-label="Поле игры">
            <div class="items" id="items" aria-hidden="true"></div>
            <div class="catcher" id="catcher" aria-label="Ловитель ключей">
              <svg class="catcher__svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <path id="catcherOuter" class="catcher__outer" d="" />
                <path id="catcherMid" class="catcher__mid" d="" />
                <path id="catcherInner" class="catcher__inner" d="" />
              </svg>
              <button class="player" id="player" type="button" aria-label="Ловитель (влево/вправо)">
                <img
                  class="player__img"
                  src="./asset/game-items/logo%20ball.svg"
                  alt=""
                  draggable="false"
                />
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
